name: Garden browser regressions

on:
  pull_request:
    paths:
      - "index.html"
      - "nha3d/**"
      - "_xuong-3d/**"
      - "sw.js"
      - "assets/3d/**"
      - "scripts/**"
      - "docs/garden-two-device-test.md"
      - "tests/browser/**"
      - "tests/staging/**"
      - "firebase.nha3d-staging.json"
      - "tests/firebase/**"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/garden-browser.yml"
      - ".gitignore"
  push:
    branches:
      - "fix/**"

permissions:
  contents: write

jobs:
  # Independent fast security gate. No browser/apt packages, no cloud project.
  # Runs only for this Draft laboratory branch so a leaked Firestore SDK stream
  # is visible without waiting for the full Playwright suite to complete.
  emulator-presence:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'staging/nha3d-integrated-review-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Run isolated authenticated presence / Emulator teardown tests
        # Fail quickly on leaked SDK listeners. Never mask the exit status.
        run: timeout --signal=TERM --kill-after=3s 75s npx firebase emulators:exec --project demo-goc-nho-safety --only firestore "node --test --test-concurrency=1 tests/firebase/nha3d-presence-client.test.mjs"

  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      # GitHub ubuntu-24.04 runners already include Chromium's core system libs.
      # Avoid apt-get font downloads in --with-deps: the Ubuntu archive mirror
      # had a DNS outage on 2026-11-11, failing CI before any tests executed.
      # Browser tests still run; missing runtime libs will fail the test job.
      - name: Install Playwright Chromium (no apt mirror dependency)
        run: npx playwright install chromium
      - name: Render and validate updated 3D house geometry
        if: github.event.pull_request.head.ref == 'feature/house-room-continuity'
        run: |
          npm install --no-save three@0.169.0
          python3 -m pip install --break-system-packages Pillow
          ln -s "$GITHUB_WORKSPACE/node_modules/three" _xuong-3d/three
          cp _xuong-3d/run.js _xuong-3d/run.cjs
          python3 -m http.server 8901 --directory _xuong-3d >/tmp/house-render.log 2>&1 &
          node _xuong-3d/run.cjs map.js out_house bando
          python3 scripts/pack-house-map.py
      - name: Test app and house navigation
        run: npm test
      - name: Publish 3D preview for visual inspection
        if: github.event.pull_request.head.ref == 'feature/house-room-continuity'
        uses: actions/upload-artifact@v4
        with:
          name: house-3d-preview
          path: out_house/ban_do_ngay@3x.png
          retention-days: 7
      - name: Commit validated house renders to PR branch
        if: github.event.pull_request.head.ref == 'feature/house-room-continuity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/ban_do_sang.webp assets/3d/ban_do_ngay.webp assets/3d/ban_do_chieu.webp assets/3d/ban_do_dem.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render: updated dollhouse exterior and connected rooms"
            git push origin HEAD:feature/house-room-continuity
          fi

      - name: Build isolated Nhà 3D staging review bundle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'staging/nha3d-integrated-review-20261108'
        run: node scripts/build-nha3d-staging.mjs
      - name: Upload Nhà 3D staging review artifact (no deployment)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'staging/nha3d-integrated-review-20261108'
        uses: actions/upload-artifact@v4
        with:
          name: nha3d-staging-review
          path: dist-nha3d-staging/
          if-no-files-found: error
          retention-days: 7
