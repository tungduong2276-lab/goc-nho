<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Thử nghiệm nhà nhiều phòng · Góc Nhỏ</title>
<style>
:root{font-family:system-ui,sans-serif;color:#243451;background:#fceef3}*{box-sizing:border-box}
body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}
header{position:fixed;top:env(safe-area-inset-top,12px);left:12px;right:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
.pill,button{border:2px solid #243451;border-radius:16px;background:white;padding:10px 14px;color:#243451;font:700 14px system-ui;box-shadow:0 3px 0 #243451}
a{color:inherit;text-decoration:none}button{cursor:pointer;min-height:44px}button:focus-visible{outline:3px solid #e45b95}
#rooms{display:flex;gap:6px;flex-wrap:wrap}#rooms button[aria-current=true]{background:#ffe08c}
footer{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:end;pointer-events:none}
footer>*{pointer-events:auto}.status{background:#fffdf3;border:2px solid #243451;border-radius:16px;padding:10px 12px;max-width:60%;font-size:13px;font-weight:700}
#doors{display:flex;flex-direction:column;gap:8px}#activities{position:fixed;right:12px;bottom:calc(128px + env(safe-area-inset-bottom));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:48vw;pointer-events:auto}#activities button{background:#e8f7ec}#doors button{background:#ffe2ed}
small{display:block;font-weight:500;margin-top:3px}
#lab-help{position:fixed;top:clamp(100px,14vh,136px);left:12px;z-index:3;width:min(390px,calc(100vw - 24px));background:#fffdf3;border:2px solid #243451;border-radius:16px;box-shadow:0 3px 0 #243451;padding:11px 12px;font-size:13px}
#lab-help[hidden]{display:none}#lab-help p{margin:5px 0 8px;line-height:1.45}#lab-help a{display:inline-block;border:2px solid #243451;border-radius:12px;background:#e8f7ec;font-weight:700;padding:9px 12px;min-height:44px}#lab-help small{color:#47516b;line-height:1.35}
#error{position:fixed;inset:25% 15%;background:white;padding:24px;border-radius:16px;z-index:4}
@media(max-width:420px){header{gap:5px}.pill,button{padding:8px 10px;font-size:12px}.status{max-width:52%}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<canvas id="world" aria-label="Phòng 3D có thể chuyển qua cửa"></canvas>
<header><a class="pill" href="./">‹ Nhà 3D</a><span class="pill">Thử nghiệm · Chưa đồng bộ hai máy</span><nav id="rooms" aria-label="Chọn phòng"></nav></header>
<footer><div class="status"><span id="status" role="status" aria-live="polite">Đang dựng phòng…</span><small>Chạm sàn để đi · Chọn cửa để sang phòng</small></div><div id="activities" aria-label="Tương tác trong phòng"></div><div id="doors" aria-label="Các cửa ra vào"></div></footer>
<aside id="lab-help" hidden aria-label="Trạng thái kết nối hai tab">
<strong>🧪 Hai tab cùng Chrome · Bản sửa V2.2</strong>
<p id="lab-state" role="status" aria-live="polite">Đang nạp chương trình kết nối...</p>
<a id="lab-open" href="?lab=two-tabs&amp;join=1&amp;rev=20261111b" target="_blank" rel="noopener">Mở tab thứ hai trong Chrome này</a>
<small id="lab-detail">Chỉ hai tab của cùng một hồ sơ Chrome, không phải hai thiết bị hoặc hai cửa sổ ẩn danh khác nhau.</small>
</aside>
<div id="error" hidden role="alert"></div>
<script>
(() => {
  if (new URLSearchParams(location.search).get("lab") !== "two-tabs") return;
  const panel = document.getElementById("lab-help");
  panel.hidden = false;
  const link = new URL(location.href);
  link.searchParams.set("lab", "two-tabs");
  link.searchParams.set("join", "1");
  link.searchParams.set("rev", "20261111b");
  document.getElementById("lab-open").href = link.href;
  setTimeout(() => {
    if (!window.__NHA3D_PREVIEW_STATE__) document.getElementById("lab-state").textContent =
      "🔴 Không tải được bộ điều khiển 3D. Hãy tải lại bằng Ctrl+Shift+R hoặc kiểm tra kết nối đến CDN.";
  }, 30000);
})();
</script>
<script type="module" src="./multiroom-preview.js?rev=20261111b"></script>
</body></html>
